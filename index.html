<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Your App Name Here</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      color: #222;
      text-align: center;
    }

    .box {
      background: #fff;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      max-width: 420px;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 18px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Opening App...</h2>
    <p>If it does not open automatically, click the button below.</p>

    <a id="openApp" href="https://script.google.com/macros/s/AKfycbz5AMs8otZ9cXMZAIPRZgxi0Nk5sPkS3gH8i5lvPVSlvjyv4ia9KJ_eser2c23Wm9400Q/exec">Open App</a>
  </div>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbz5AMs8otZ9cXMZAIPRZgxi0Nk5sPkS3gH8i5lvPVSlvjyv4ia9KJ_eser2c23Wm9400Q/exec";

    document.getElementById("openApp").href = APP_URL;

    window.location.href = APP_URL;
  </script>
</body>
</html>
